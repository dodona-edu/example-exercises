- tab: "Number of Pokémon"
  testcases:
    - expression: "number_of_pokemon('pokemon.csv')"
      input_files:
        - path: "pokemon.csv"
          content: !path "pokemon.csv"
      return: 20
    - expression: "number_of_pokemon('starters.csv')"
      input_files:
        - path: "starters.csv"
          content: !path "starters.csv"
      return: 9
    - expression: "number_of_pokemon('eeveelutions.csv')"
      input_files:
        - path: "eeveelutions.csv"
          content: !path "eeveelutions.csv"
      return: 4
    - expression: "number_of_pokemon('legendary.csv')"
      input_files:
        - path: "legendary.csv"
          content: !path "legendary.csv"
      return: 1

- tab: "Types"
  testcases:
    - expression: "all_types('pokemon.csv')"
      input_files:
        - path: "pokemon.csv"
          content: !path "pokemon.csv"
      return: ["Dragon", "Electric", "Fire", "Ghost", "Grass", "Normal", "Psychic", "Water"]
    - expression: "all_types('starters.csv')"
      input_files:
        - path: "starters.csv"
          content: !path "starters.csv"
      return: ["Fire", "Grass", "Water"]
    - expression: "all_types('eeveelutions.csv')"
      input_files:
        - path: "eeveelutions.csv"
          content: !path "eeveelutions.csv"
      return: ["Electric", "Fire", "Normal", "Water"]
    - expression: "all_types('legendary.csv')"
      input_files:
        - path: "legendary.csv"
          content: !path "legendary.csv"
      return: ["Psychic"]

- tab: "Strongest"
  testcases:
    - expression: "strongest_pokemon('pokemon.csv')"
      input_files:
        - path: "pokemon.csv"
          content: !path "pokemon.csv"
      return: "Mewtwo"
    - expression: "strongest_pokemon('starters.csv')"
      input_files:
        - path: "starters.csv"
          content: !path "starters.csv"
      return: "Charizard"
    - expression: "strongest_pokemon('eeveelutions.csv')"
      input_files:
        - path: "eeveelutions.csv"
          content: !path "eeveelutions.csv"
      return: "Vaporeon"
    - expression: "strongest_pokemon('legendary.csv')"
      input_files:
        - path: "legendary.csv"
          content: !path "legendary.csv"
      return: "Mewtwo"

- tab: "Strongest per type"
  testcases:
    - expression: "strongest_per_type('pokemon.csv')"
      input_files:
        - path: "pokemon.csv"
          content: !path "pokemon.csv"
      return:
        Dragon: "Dragonite"
        Electric: "Jolteon"
        Fire: "Charizard"
        Ghost: "Gengar"
        Grass: "Venusaur"
        Normal: "Snorlax"
        Psychic: "Mewtwo"
        Water: "Gyarados"
    - expression: "strongest_per_type('starters.csv')"
      input_files:
        - path: "starters.csv"
          content: !path "starters.csv"
      return:
        Fire: "Charizard"
        Grass: "Venusaur"
        Water: "Blastoise"
    - expression: "strongest_per_type('eeveelutions.csv')"
      input_files:
        - path: "eeveelutions.csv"
          content: !path "eeveelutions.csv"
      return:
        Electric: "Jolteon"
        Fire: "Flareon"
        Normal: "Eevee"
        Water: "Vaporeon"
    - expression: "strongest_per_type('legendary.csv')"
      input_files:
        - path: "legendary.csv"
          content: !path "legendary.csv"
      return:
        Psychic: "Mewtwo"

- tab: "Chart"
  contexts:
    - testcases:
        - statement:
            python: "fig = submission.plot_top_pokemon('starters.csv', 3)"
          input_files:
            - path: "starters.csv"
              content: !path "starters.csv"
        - expression:
            python: "fig.axes[0].get_title()"
          return: "Top 3 Pokémon by total stats"
        - expression:
            python: "fig.axes[0].get_xlabel()"
          return: "Pokémon"
        - expression:
            python: "fig.axes[0].get_ylabel()"
          return: "Total stats"
        - expression:
            python: "len(fig.axes[0].patches)"
          return: 3
        - expression:
            python: "[round(p.get_height()) for p in fig.axes[0].patches]"
          return: [534, 530, 525]
        - expression:
            python: "[t.get_text() for t in fig.axes[0].get_xticklabels()]"
          return: ["Charizard", "Blastoise", "Venusaur"]
    - testcases:
        - statement:
            python: "fig = submission.plot_top_pokemon('pokemon.csv', 5)"
          input_files:
            - path: "pokemon.csv"
              content: !path "pokemon.csv"
        - expression:
            python: "fig.axes[0].get_title()"
          return: "Top 5 Pokémon by total stats"
        - expression:
            python: "len(fig.axes[0].patches)"
          return: 5
        - expression:
            python: "[round(p.get_height()) for p in fig.axes[0].patches]"
          return: [680, 600, 540, 540, 534]
        - expression:
            python: "[t.get_text() for t in fig.axes[0].get_xticklabels()]"
          return: ["Mewtwo", "Dragonite", "Snorlax", "Gyarados", "Charizard"]
        # Capture the returned figure and render it in the feedback table.
        - statement:
            python: "fig.savefig('chart.png')"
        - description: "We render the chart you built below"
          expression:
            python: "True"
          return: !oracle
            value: true
            oracle: "custom_check"
            file: "render.py"
            name: "render"
    - testcases:
        - statement:
            python: "fig = submission.plot_top_pokemon('legendary.csv', 1)"
          input_files:
            - path: "legendary.csv"
              content: !path "legendary.csv"
        - expression:
            python: "fig.axes[0].get_title()"
          return: "Top 1 Pokémon by total stats"
        - expression:
            python: "len(fig.axes[0].patches)"
          return: 1
        - expression:
            python: "[round(p.get_height()) for p in fig.axes[0].patches]"
          return: [680]
