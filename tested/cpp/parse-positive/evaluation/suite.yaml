# C++ exception types are GCC typeid names: St16invalid_argument is std::invalid_argument
- tab: "parse_positive"
  testcases:
    - expression: "parse_positive('42')"
      return: 42
    - expression: "parse_positive('7')"
      return: 7
    - expression: "parse_positive('0')"
      exception:
        message: "not a positive number"
        types:
          cpp: "St16invalid_argument"
    - expression: "parse_positive('-3')"
      exception:
        message: "not a positive number"
        types:
          cpp: "St16invalid_argument"
    - expression: "parse_positive('abc')"
      exception:
        message: "not a positive number"
        types:
          cpp: "St16invalid_argument"
